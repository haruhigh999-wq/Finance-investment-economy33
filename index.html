function updateRivals(){for(let r of S.rivals){if(r.bankrupt)continue;for(let[id,n]of Object.entries(r.holdings)){let a=getAsset(id);if(id.startsWith('p'))r.cash+=n*a.price*(a.rent*a.occupancy-a.maintenance)/12;else r.cash+=n*a.price*a.yield/12}for(const e of S.activeMarketEffects.filter(e=>e.endDate>S.month&&e.data.kind==='rival-plan'&&e.data.rival===r.name)){const id=e.affectedAssets[0],spend=Math.max(0,r.cash)*e.data.cashFraction;r.cash-=spend;r.holdings[id]=(r.holdings[id]||0)+spend/getAsset(id).price;}if(S.month%3===0){let current=Object.entries(r.holdings);for(let[id,n]of current){let sell=n*rand(.1,.3);r.holdings[id]-=sell;r.cash+=sell*getAsset(id).price}let buy=pick(r.targets),spend=r.cash*(r.risk>.6?.85:.55);if(Math.random()<.15)buy=pick(liquidAssets()).id;r.holdings[buy]=(r.holdings[buy]||0)+spend/getAsset(buy).price;r.cash-=spend;}if(S.month%12===0){r.debt*=1.09;let net=rivalWorth(r),ret=(net-r.yearStart)/Math.max(1,Math.abs(r.yearStart));r.best=Math.max(r.best,ret);r.worst=Math.min(r.worst,ret);r.yearStart=net;}r.worth=rivalWorth(r);if(r.worth<-30000){r.bankrupt=true;r.holdings={};r.cash=0;r.worth=-r.debt;addNews(r.name+' is bankrupt','Rival','bad','Leverage overwhelmed the remaining portfolio.',r.name,4)}r.history.push(r.worth);r.history=r.history.slice(-121)}}
function advice(plan){let v=values(),warnings=riskWarnings();let specific=plan.id===0?'Diversification and cash reserves help absorb surprises.':plan.id===1?`Current lending costs are ${(interestRate()*100).toFixed(1)}%. Expected income yield is ${v.total>0?(annualDividend()/v.total*100).toFixed(1):0}%. Growth must cover the difference.`:S.activeRumors.length?`Research signal: ${S.activeRumors[0].title}. Estimated accuracy is ${S.activeRumors[0].accuracy}%; it can still be false.`:'Watch industry valuation and financing risk. A recent winner may reverse.';let text=warnings.length?pick(warnings)+' '+specific:specific;if(S.activeEvents.length)text+=' Active backdrop: '+eventDefs[S.activeEvents[0].def][0]+'.';if(Math.random()>.85)text+=' Tentative signal: '+pick(industries)+' may outperform; this forecast can be wrong.';plan.advice.unshift({month:S.month,text});plan.advice=plan.advice.slice(0,15)}
function premium(ins){let exposure=ins.id===0?S.player.debt:ins.id===1?values().stock+values().fund+values().crypto:values().broker+annualDividend()*10;return Math.round((ins.cost+exposure*.0075)*(1+sum(S.activeEvents.filter(e=>eventDefs[e.def][1]<0).map(e=>e.severity))*.12))}
function chargeServices(){for(let x of S.subscriptions){if(x.active&&S.month>=x.next){if(S.player.cash>=x.cost){S.player.cash-=x.cost;S.yearStats.subscriptions+=x.cost;x.next+=12}else{x.active=false;addNews(x.name+' cancelled','Subscription','bad','Cash was insufficient for renewal.','Player',1)}}if(x.active)advice(x)}for(let x of S.insurances){if(x.active&&S.month>=x.next){let cost=premium(x);if(S.player.cash>=cost){S.player.cash-=cost;S.yearStats.insurance+=cost;x.paid=cost;x.next+=12}else{x.active=false;addNews(x.name+' lapsed','Insurance','bad','Cash was insufficient for the annual premium.','Player',2)}}}}
function annualReport(){let st=S.yearStats;for(let a of liquidAssets()){let normal=(S.holdings[a.id]?.units||0)*a.price*a.yield,div=normal*clamp(1+effect(a),.35,1.25);S.player.cash+=div;st.dividends+=div;if(severe())cover(2,Math.max(0,normal-div))}for(let b of S.brokers){let fee=b.value*b.fee;b.value-=fee;b.profit-=fee;st.brokerFees+=fee}if(severe())cover(0,st.interest);let sorted=[...S.companies].sort((a,b)=>stockReturn(b,12)-stockReturn(a,12)),v=values(),ret=S.annualStart>0?(v.net-S.annualStart)/S.annualStart:null;S.annualReports.unshift({year:START_YEAR+S.month/12-1,start:S.annualStart,end:v.net,profit:v.net-S.annualStart,ret,...st,events:S.eventLog.filter(e=>e.start>S.month-12&&e.start<=S.month).map(e=>eventDefs[e.def][0]),rumors:S.rumorLog.filter(r=>r.end>S.month-12&&r.end<=S.month).map(r=>r.title+' — '+r.result),best:sorted[0].name,worst:sorted.at(-1).name,rival:[...S.rivals].sort((a,b)=>(b.history.at(-1)/Math.max(1,b.history[Math.max(0,b.history.length-13)]))-(a.history.at(-1)/Math.max(1,a.history[Math.max(0,a.history.length-13)])))[0].name,rank:playerRank(),advice:riskWarnings()[0]||'Maintain diversification and a cash reserve for future fees.'});S.annualReports=S.annualReports.slice(0,100);S.annualStart=v.net;S.yearStats=counters();addNews('Your annual report is ready','Annual report','mixed',`${START_YEAR+S.month/12-1} closed at ${money(v.net)} net worth. See Portfolio → Annual reports.`,'Player',2)}

function updateTime(){if(S.bankrupt)return;S.month++;expireEffects();for(let e of S.activeEvents.filter(e=>e.end<=S.month)){let log=S.eventLog.find(x=>x.start===e.start&&x.def===e.def);if(log)log.result=S.indexFunds[0].price/e.startIndex-1}S.activeEvents=S.activeEvents.filter(e=>e.end>S.month);if(S.month%24===0)triggerWorldEvent();if(S.month>=S.nextRumor){triggerRumor();S.nextRumor=S.month+Math.floor(rand(3,7))}resolveRumors();monthlyNews();updatePrices();updateRealEstateValues();updateBrokerValues();updateRivals();let interest=S.player.debt*(Math.pow(1+interestRate(),1/12)-1);S.player.debt+=interest;S.yearStats.interest+=interest;chargeServices();let v=values();if(S.month%12===0){let ratio=S.player.debt/Math.max(1,v.total),risky=v.crypto/Math.max(1,v.total);S.player.credit=clamp(S.player.credit+(ratio<.5?3:ratio<1.1?1:-6)+(v.net>S.annualStart?2:-1)-(risky>.6?3:0)-(Object.entries(S.holdings).some(([id,h])=>id.startsWith('s')&&h.units*getAsset(id).price>v.total*.6)?2:0)-(severe()?2:0),0,100);annualReport()}S.history.push(calculateNetWorth());S.history=S.history.slice(-241);if(playerRank()===1){S.rankMonths++;if(!S.achievements.includes('Rank #1 — beat all rivals'))S.achievements.push('Rank #1 — beat all rivals');if(S.rankMonths>=60&&!S.achievements.includes('Five years at the top'))S.achievements.push('Five years at the top')}else S.rankMonths=0;checkEnd();if(S.month%3===0)saveGame(false)}
function checkEnd(){let v=values(),p=S.player,grace=S.month>=12,protection=S.insurances[0].active?1.25:1;if(grace&&p.debt>0&&((p.debt>Math.max(150000,v.total*2)*protection&&v.net< -50000)||v.net< -1000000*protection||(p.credit<10&&p.debt>v.total*1.35&&p.cash<p.debt*.02))){S.bankrupt=true;S.reason=p.credit<10?'Credit collapsed and liquid reserves could not cover obligations.':'Debt exceeded the value your assets could support.';S.speed=0;showEnd();saveGame(false)}else if(v.net>=GOAL&&!S.hasWon){S.hasWon=true;if(S.rivals.every(r=>r.worth<GOAL))S.achievements.push('First billionaire');showEnd();saveGame(false)}}
function riskWarnings(){let v=values(),w=[];if(S.player.debt>v.total*.8&&S.player.debt>0)w.push('Warning: Your debt is becoming dangerous.');if(Object.entries(S.holdings).some(([id,h])=>id.startsWith('s')&&h.units*getAsset(id).price>v.total*.55))w.push('Warning: Your portfolio is too concentrated in one stock.');if(severe())w.push('Warning: A severe world event is damaging the market.');if(interestRate()>=.18)w.push('Warning: Your interest rate is very high.');if(v.crypto>v.total*.4)w.push('Warning: You have too much crypto exposure.');if(S.brokers.some(b=>b.value>0&&b.fee>=.025))w.push('Warning: Your broker fees are reducing your long-term profit.');if(sum(S.properties.map(a=>(S.holdings[a.id]?.units||0)*a.price*a.maintenance))>Math.max(1000,S.player.cash*.2))w.push('Warning: Your real estate maintenance costs are high.');if(S.rivals.some(r=>r.worth<v.net&&r.worth>v.net*.9))w.push('Warning: A rival investor is close to overtaking you.');return w}
function stockReturn(a,months=1){return a.price/a.history[Math.max(0,a.history.length-1-months)]-1}
function chart(data,red=true,labels=true){if(!data.length)data=[0,0];if(data.length===1)data=[data[0],data[0]];let w=680,h=220,p=labels?42:5,min=Math.min(...data),max=Math.max(...data),span=max-min||Math.max(1,max*.1);min-=span*.12;max+=span*.12;span=max-min;let points=data.map((v,i)=>[(p+i/(data.length-1)*(w-p-15)).toFixed(1),(h-32-(v-min)/span*(h-52)).toFixed(1)]),path=points.map((xy,i)=>(i?'L':'M')+xy.join(',')).join(' '),c=red?'var(--loss)':'var(--accent)',last=points.at(-1);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Historical value chart">${labels?[0,.5,1].map(t=>{let y=h-32-t*(h-52);return `<line x1="${p}" x2="665" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 5"/><text x="0" y="${y+4}">${(min+span*t)>=1e6?((min+span*t)/1e6).toFixed(1)+'M':(min+span*t)>=1e3?((min+span*t)/1e3).toFixed(1)+'K':(min+span*t).toFixed(1)}</text>`}).join(''):''}<path d="${path} L${last[0]},${h-32} L${p},${h-32} Z" fill="${c}" opacity=".08"/><path d="${path}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${c}"/>${labels?[0,.25,.5,.75,1].map((t,i)=>`<text x="${p+t*(w-p-15)}" y="216" text-anchor="${i===4?'end':'start'}">${date(S.month-Math.round((data.length-1)*(1-t)))}</text>`).join(''):''}</svg>`}

le="border-color:var(--accent)"><span class="pill">YOUR FIRST MOVE</span><h2 style="margin-top:18px">Turn ambition into capital.</h2><p>You start with RU$0. A bank loan can open the door, but every loan has a cost.</p>${row('Initial credit line','RU$100,000')}${row('Starting annual rate','8%')}<div style="margin-top:18px">${btn('Visit the bank →','nav','Bank','primary')}</div></section>`:''}<section class="card"><div class="between"><h2>World pulse</h2><span class="badge">${S.activeEvents.length} active</span></div>${eventCards()}</section><section class="card"><div class="between"><h2>The race to a billion</h2><span class="pill">#${playerRank()} OF 7</span></div>${leaderboard().slice(0,4).map((r,i)=>row(`${i+1}. ${r.name}`,money(r.worth,true))).join('')}<div style="margin-top:15px">${btn('Meet your rivals ↗','nav','Rivals')}</div></section><section class="card"><h2>On the wire</h2>${newsCards(S.newsLog.slice(0,3))}${btn('All news & rumors →','nav','News / Events')}</section></div></div>${warnings.map(w=>`<div class="note warn">${w}</div>`).join('')}<div class="card section"><h2>Active rumors <span class="badge">${S.activeRumors.length}</span></h2>${S.activeRumors.length?S.activeRumors.map(r=>`<div class="row"><span>${r.title}</span><strong>${r.accuracy}% estimate · ${r.end-S.month} months</strong></div>`).join(''):empty('No unconfirmed signals. Stay patient.')}</div>`}

function riskLabel(n){return n<.3?'Low':n<.55?'Moderate':n<.85?'High':'Very high'}
function renderMarket(){let assets=marketTab==='stock'?S.companies:S.indexFunds;assets=assets.filter(a=>(a.name+' '+a.ticker).toLowerCase().includes(query.toLowerCase())&&(sector==='All industries'||a.industry.includes(sector)));return heading('The market','120 fictional companies. Six diversified funds. A world of possibilities.')+`<div class="tabs">${btn('Companies · 120','market-tab','stock',marketTab==='stock'?'selected':'')}${btn('Index funds · 6','market-tab','fund',marketTab==='fund'?'selected':'')}</div><div class="card"><div class="toolbar"><input id="search" aria-label="Search assets" placeholder="Search company or symbol…" value="${esc(query)}"><select id="sector" aria-label="Industry">${['All industries',...industries].map(i=>`<option ${i===sector?'selected':''}>${i}</option>`).join('')}</select><span class="badge" style="align-self:center">${assets.length} assets</span></div>${assetTable(assets)}</div>`}
function renderCompanyDetail(){let a=getAsset(selected),h=S.holdings[a.id];return heading(a.name,a.description,btn('← Back to market','nav',a.type==='crypto'?'Crypto':'Market'))+`<div class="layout"><section class="card"><div class="between"><span class="pill">${a.ticker} · ${a.type.toUpperCase()}</span><span class="badge">${riskLabel(a.risk)} risk</span></div><div class="stat" style="font-size:38px">${money(a.price)}</div><p class="${color(stockReturn(a))}">${pct(stockReturn(a))} this month</p>${chart(a.history.slice(-61))}<div class="grid two">${row('Annual growth potential',(a.growth*100).toFixed(1)+'%')}${row('Dividend yield',(a.yield*100).toFixed(2)+'%')}${row('Popularity',a.popularity+'/100')}${row('Financial health',a.health+'/100')}${row('Movement style',a.style)}${row('Industry',esc(a.industry))}</div><div class="note">${esc(a.news)}${assetNewsTiming(a)}</div>${a.type==='crypto'?row('Sentiment',a.sentiment)+row('Monthly volatility scale',(a.risk*.27*100).toFixed(0)+'%'):''}</section><div><section class="card"><h2>Make your move</h2>${row('Available cash',money(S.player.cash))}${row('Owned units',(h?.units||0).toLocaleString('en-US',{maximumFractionDigits:6}))}<label for="tradeUnits" class="muted" style="display:block;margin-top:20px">${a.type==='crypto'?'Units':'Number of shares'}</label><input style="width:100%;margin:8px 0" type="number" id="tradeUnits" min="0.000001" step="any" value="1"><p id="tradeEstimate">Estimated value: ${money(a.price)}</p><div class="flex">${btn('Buy','buy',a.id,'primary')}${btn('Sell','sell',a.id)}${btn('Max buy','max-buy',a.id)}${btn('Sell all','sell-all',a.id)}</div><p style="font-size:11px;margin:18px 0 0">Time pauses while entering an order. Market orders execute at the displayed simulation price. Fractional units are supported.</p></section><section class="card"><h2>Your position</h2>${row('Average cost',money(h?.average||0))}${row('Market value',money((h?.units||0)*a.price))}${row('Unrealized P/L',`<span class="${color(h?a.price-h.average:0)}">${money(h?(a.price-h.average)*h.units:0)}</span>`)}${row('5-year return',pct(stockReturn(a,60)))}</section></div></div>`}
function holdingTable(){let v=values();return `<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Units</th><th>Average cost</th><th>Price</th><th>Value</th><th>Unrealized P/L</th><th>Return</th><th>Allocation</th></tr></thead><tbody>${Object.entries(S.holdings).map(([id,h])=>{let a=getAsset(id),pl=(a.price-h.average)*h.units;return `<tr><td>${btn(a.name,'detail-or-property',id)}</td><td>${h.units.toLocaleString('en-US',{maximumFractionDigits:6})}</td><td>${money(h.average)}</td><td>${money(a.price)}</td><td>${money(a.price*h.units)}</td><td class="${color(pl)}">${money(pl)}</td><td class="${color(pl)}">${pct(a.price/h.average-1)}</td><td>${(a.price*h.units/Math.max(1,v.total)*100).toFixed(1)}%</td></tr>`}).join('')}</tbody></table></div>`}
function renderPortfolio(){let v=values();return heading('Your portfolio','One view of every asset, liability and decision.')+`<div class="grid four">${stat('Net worth',money(v.net,true))}${stat('Cash',money(v.cash,true))}${stat('Debt',money(S.player.debt,true))}${stat('Lifetime P/L',money(v.net,true))}</div><div class="grid two section"><section class="card"><h2>Asset allocation</h2>${[['Cash',v.cash],['Stocks',v.stock],['Index funds',v.fund],['Brokers',v.broker],['Crypto',v.crypto],['Real estate',v.property]].map(([name,n])=>`<div class="between"><span>${name}</span><span>${money(n,true)} <small> · ${(n/Math.max(1,v.total)*100).toFixed(1)}%</small></span></div><div class="progress"><i style="width:${n/Math.max(1,v.total)*100}%"></i></div>`).join('')}</section><section class="card"><h2>Income & managed assets</h2>${row('Estimated annual dividends',money(annualDividend()))}${row('Rental income this year',money(S.yearStats.rent))}${row('Maintenance this year',money(S.yearStats.maintenance))}${S.brokers.map(b=>row(b.name,money(b.value))).join('')}</section></div><section class="card"><h2>All holdings</h2>${Object.keys(S.holdings).length?holdingTable():empty('Your portfolio is a blank canvas. Borrow capital, then buy your first asset.')}</section><section class="card"><h2>Annual reports</h2>${S.annualReports.length?S.annualReports.map(r=>`<details class="report"><summary>${r.year} · ${money(r.end)} · Rank #${r.rank}</summary><div class="grid two">${[['Opening net worth',money(r.start)],['Closing net worth',money(r.end)],['Annual P/L',money(r.profit)],['Annual return',r.ret===null?'N/A — nonpositive starting equity':pct(r.ret)],['Interest capitalized into debt',money(r.interest)],['Cash interest paid','RU$0.00'],['Dividends received',money(r.dividends)],['Broker fees',money(r.brokerFees)],['Subscription fees',money(r.subscriptions)],['Insurance premiums',money(r.insurance)],['Insurance reimbursements',money(r.protections)],['Real estate income',money(r.rent)],['Maintenance paid',money(r.maintenance)],['Best stock',r.best],['Worst stock',r.worst],['Best rival performer',r.rival]].map(x=>row(...x)).join('')}</div><p>World events: ${r.events.join(', ')||'None started this year.'}</p><p>Rumors: ${r.rumors.join(', ')||'None resolved.'}</p><div class="note">${r.advice}</div></details>`).join(''):empty('Your first report arrives at the end of the first game year.')}</section>`}
function renderBank(){return heading('Capital comes at a cost.','Borrow carefully. Repay deliberately. Protect your credit.')+`<div class="grid four">${stat('Current debt',money(S.player.debt,true))}${stat('Annual interest',(interestRate()*100).toFixed(1)+'%','Includes active world events')}${stat('Credit score',Math.round(S.player.credit)+'/100')}${stat('Available loan',money(loanLimit(),true))}</div><div class="grid two section"><section class="card"><h2>Bank of Meridian</h2><p>Your first credit line is RU$100,000. Later capacity grows with equity and credit quality.</p><label for="bankAmount">Amount in RU$</label><div class="flex" style="margin-top:10px"><input id="bankAmount" type="number" min="1" value="10000" step="1000">${btn('Borrow','borrow','','primary')}${btn('Repay','repay')}</div><div class="note">Interest compounds monthly at the annual equivalent rate. At a constant 8%, a RU$100,000 debt becomes RU$108,000 after one year. Unpaid interest is added to debt.</div>${row('Cash available',money(S.player.cash))}${row('Debt / assets',values().total>0?(S.player.debt/values().total*100).toFixed(1)+'%':'—')}</section><section class="card"><h2>Your credit ladder</h2>${[['90–100','3%'],['75–89','5%'],['60–74','8%'],['40–59','12%'],['20–39','18%'],['0–19','25%']].map(x=>row(x[0]+' credit',x[1]+' base rate')).join('')}<p class="subtext" style="margin-top:15px">Repayments, growing equity and low leverage improve credit. Negative equity, concentration and crises weaken it.</p></section></div>${riskWarnings().map(w=>`<div class="note warn">${w}</div>`).join('')}<div class="note warn">Bankruptcy is assessed after a 12-month startup grace period. Excessive debt, deeply negative net worth or collapsed credit can end the game. Insurance reduces some risk, but cannot prevent every failure.</div>`}
function renderBrokers(){return heading('Put a manager to work.','Delegated investing, distinct strategies and a real annual fee.')+`<div class="grid two">${S.brokers.map(b=>`<section class="card"><span class="pill">${riskLabel(b.risk)} RISK</span><h2 style="margin-top:15px">${b.name}</h2><p>${b.industries.join(' · ')}</p>${row('Annual fee',(b.fee*100).toFixed(1)+'%')}${row('Minimum initial deposit',money(b.min))}${row('Current account value',money(b.value))}${row('Net contributions',money(b.contributed))}${row('Total profit / loss',`<span class="${color(b.profit)}">${money(b.profit)}</span>`)}${chart(b.history,false)}<div class="flex"><input aria-label="Amount for ${b.name}" id="broker${b.id}" type="number" min="0.01" value="${b.min}">${btn('Deposit','broker-in',b.id,'primary')}${btn('Withdraw','broker-out',b.id)}</div><small>Annual fees are deducted at the calendar year end.</small></section>`).join('')}</div>`}
function renderSubscriptions(){return heading('A second opinion. Never a guarantee.','Annual plans, renewed on your subscription anniversary. Cancel any time.')+`<div class="grid">${S.subscriptions.map(x=>`<section class="card"><span class="pill">${x.active?'ACTIVE':'RESEARCH PLAN'}</span><h2 style="margin-top:16px">${x.name}</h2><div class="stat">${money(x.cost)}<small> / year</small></div><p>${x.description}</p>${row('Signal quality',x.quality+'/100')}${x.active?row('Next renewal',date(x.next)):''}${btn(x.active?'Cancel subscription':'Subscribe', 'subscription',x.id,x.active?'':'primary')}<p class="subtext" style="margin-top:15px">Fees are charged immediately. No prorated refunds. Quality is an estimate, not a success rate.</p></section>`).join('')}</div><section class="card"><h2>Your advice feed</h2>${S.subscriptions.filter(s=>s.active).flatMap(x=>x.advice.map(a=>({...a,name:x.name}))).sort((a,b)=>b.month-a.month).map(a=>`<div class="news"><small>${a.name} · ${date(a.month)}</small><p>${a.text}</p></div>`).join('')||empty('Subscribe to receive contextual monthly observations.')}</section>`}
function renderInsurance(){return heading('Protect part of the downside.','Limited cover, annual premiums and explicit tradeoffs.')+`<div class="grid">${S.insurances.map(x=>`<section class="card"><span class="pill">${x.active?'COVER ACTIVE':'INACTIVE'}</span><h2 style="margin-top:16px">${x.name}</h2><p>${x.description}</p>${row('Annual quote',money(premium(x)))}${row('Coverage',(x.cover*100)+'%')}${row('Total reimbursed',money(x.used))}${x.active?row('Next renewal',date(x.next))+row('Last premium',money(x.paid)):''}<div style="margin-top:18px">${btn(x.active?'Cancel policy':'Buy insurance','insurance',x.id,x.active?'':'primary')}</div><p class="subtext" style="margin-top:15px">Premium scales with insured exposure and world risk. Paid immediately; no refunds. Renewed annually.</p><h3>Recent protections used</h3>${x.log.map(l=>row(date(l.month),money(l.amount))).join('')||'<small>No claims paid.</small>'}</section>`).join('')}</div>`}
function renderCrypto(){return heading('The volatile frontier.','High variance, speculative sentiment and no dividend income.')+`<div class="note warn">Crypto can lose value quickly. Prices, events and trading in this game are simulated.</div><div class="card">${assetTable(S.cryptos)}</div><div class="grid section">${S.cryptos.map(a=>`<section class="card"><div class="between"><h2>${a.name}</h2><span class="pill">${a.ticker}</span></div><div class="stat">${money(a.price)}</div><p class="${color(stockReturn(a))}">${pct(stockReturn(a))} this month · ${a.sentiment}</p>${chart(a.history.slice(-61))}${row('Volatility scale',(a.risk*.27*100).toFixed(0)+'% monthly')}${row('Popularity',a.popularity+'/100')}${row('Holdings',(S.holdings[a.id]?.units||0).toFixed(6))}${row('Unrealized P/L',money((S.holdings[a.id]?.units||0)*(a.price-(S.holdings[a.id]?.average||a.price))))}<div class="flex" style="margin-top:14px">${btn('Buy / Sell','detail',a.id,'primary')}</div><p class="subtext" style="margin-top:14px">${esc(a.news)}</p>${assetNewsTiming(a)}</section>`).join('')}</div>`}
function renderRealEstate(){return heading('Build something tangible.','Rental cash flow meets vacancy, maintenance and economic cycles.')+`<div class="grid two">${S.properties.map(a=>`<section class="card"><div class="between"><span class="pill">${a.industry.toUpperCase()}</span><span class="badge">${S.holdings[a.id]?.units||0} owned</span></div><h2 style="margin-top:16px">${a.name}</h2><p>${a.description}</p><div class="stat">${money(a.price)}</div><small>Current purchase / sale price per property</small><div class="grid two">${row('Annual gross rent',money(a.price*a.rent))}${row('Annual maintenance',money(a.price*a.maintenance))}${row('Occupancy',(a.occupancy*100).toFixed(0)+'%')}${row('Location quality',a.quality+'/100')}${row('Base value growth',(a.growth*100).toFixed(1)+'%')}${row('Risk',riskLabel(a.risk))}${row('Your average purchase',money(S.holdings[a.id]?.average||0))}</div><div class="flex" style="margin-top:18px">${btn('Buy property','property-buy',a.id,'primary')}${btn('Sell property','property-sell',a.id)}</div><details><summary>Income history</summary>${a.incomeHistory.slice(-12).reverse().map(h=>row(date(h.month),money(h.income-h.cost)+' net')).join('')||'<p>No income yet.</p>'}</details></section>`).join('')}</div>`}
function renderNewsEvents(){return heading('Read the world.','Active influences have a defined lifetime. Expired effects stop contributing to future returns.')+`<section class="card"><div class="between"><h2>Active Market Effects</h2><span class="badge">${currentEffects().length} active</span></div><p class="subtext">Effects combine while active. Expiry removes their influence; it does not undo past price changes. Pending rumors have no market effect until they resolve.</p><div class="grid two">${currentEffects().map(effectCard).join('')||empty('No active market effects.')}</div></section><div class="grid two section"><section class="card"><h2>World Events</h2>${eventCards()}</section><section class="card"><h2>Rumors & Predictions</h2>${S.activeRumors.map(r=>`<div class="news"><strong>${esc(r.title)}</strong><p>${esc(r.industry)} may ${r.change>0?'rise':'fall'} if true. Possible effect ${pct(r.change)}; no guaranteed outcome.</p>${row('Accuracy estimate',r.accuracy+'%')}${row('Source reliability',r.accuracy>=70?'High':r.accuracy>=60?'Medium':'Low')}${row('Impact / risk','★★★ / High')}${row('Affected',esc(r.industry))}${row('Started',date(r.start))}${row('Confirmation window',durationText(r.end-r.start))}${row('Time until confirmation',durationText(Math.max(0,r.end-S.month)))}${row('Expected confirmation',date(r.end))}</div>`).join('')||empty('No active rumors.')}</section></div>${[['Company News',['Company']],['Industry & Market Conditions',['Industry','Market condition','Legacy market condition']],['Crypto News',['Crypto']],['Real Estate News',['Real estate']],['Rival Actions',['Rival']]].map(([title,types])=>`<section class="card"><h2>${title}</h2>${newsCards(S.newsLog.filter(n=>types.includes(n.type)).slice(0,20))}</section>`).join('')}<section class="card"><h2>All News</h2>${newsCards(S.newsLog.slice(0,60))}</section><section class="card"><h2>Event Log</h2>${S.eventLog.map(e=>effectCard(worldEffect(e))+`<p class="subtext">RU500 change over event: ${e.result===null?'Active':pct(e.result)}. Observed result includes overlapping influences.</p>`).join('')||empty('The first world event arrives in January 2028.')}<details><summary>Smaller effect history</summary>${S.effectLog.slice(0,60).map(effectCard).join('')||empty('No effects recorded.')}</details></section><section class="card"><h2>Rumor Log</h2>${S.rumorLog.map(r=>`<div class="news"><strong>${esc(r.title)} — ${r.result}</strong><p>Started ${date(r.start)} · Confirmed / denied ${date(r.end)} · accuracy estimate ${r.accuracy}% · affected ${esc(r.industry)}</p>${r.effect?`<p class="subtext">Effect duration: ${durationText(r.effect.durationMonths)}</p>${effectTiming(r.effect)}`:'<small>Legacy resolved rumor. See active effects for any migrated influence.</small>'}</div>`).join('')||empty('Resolved rumors will appear here.')}</section>`}
function renderRivals(){return heading('You are not investing alone.','Six personalities. Six strategies. One leaderboard.')+`<section class="card"><h2>Net worth leaderboard</h2>${leaderboard().map((r,i)=>row(`${i+1}. ${r.name}${r.player?' · YOU':r.bankrupt?' · BANKRUPT':''}`,money(r.worth))).join('')}</section><div class="grid two section">${S.rivals.map(r=>`<section class="card"><div class="between"><h2>${r.name}</h2><span class="pill">#${leaderboard().findIndex(x=>x.name===r.name)+1}</span></div><p>${r.personality}</p><div class="stat">${money(r.worth)}</div><span class="badge">${r.style} · ${riskLabel(r.risk)} risk</span>${chart(r.history,false)}${row('Starting net worth',money(r.starting))}${row('Cash',money(r.cash))}${row('Debt',money(r.debt))}${row('Strength',r.strength)}${row('Weakness',r.weakness)}<p class="subtext" style="margin-top:12px">Main positions: ${Object.entries(r.holdings).sort((a,b)=>getAsset(b[0]).price*b[1]-getAsset(a[0]).price*a[1]).slice(0,4).map(([id,n])=>getAsset(id).name+' ('+money(n*getAsset(id).price,true)+')').join(', ')||'None'}</p></section>`).join('')}</div><section class="card"><h2>Achievements</h2>${['Rank #1 — beat all rivals','Five years at the top','First billionaire'].map(a=>row(a,S.achievements.includes(a)?'✓ Unlocked':'○ In progress')).join('')}${row('Current rank #1 streak',S.rankMonths+' / 60 months')}</section>`}
function renderRankings(){const modes=['Top gainers','Top losers','1-year returns','5-year returns','Dividend yield','Highest risk stocks','Most stable stocks','Your best investments'];let a=[...S.companies],metric=x=>stockReturn(x);if(rankMode==='1-year returns')metric=x=>stockReturn(x,12);if(rankMode==='5-year returns')metric=x=>stockReturn(x,60);if(rankMode==='Dividend yield')metric=x=>x.yield;if(rankMode.includes('risk')||rankMode.includes('stable'))metric=x=>x.risk;if(rankMode==='Your best investments'){a=liquidAssets().filter(a=>S.holdings[a.id]);metric=x=>x.price/S.holdings[x.id].average-1}a.sort((x,y)=>(rankMode==='Top losers'||rankMode==='Most stable stocks'?1:-1)*(metric(x)-metric(y)));return heading('Find the outliers.','Past performance is a record, not a promise.')+`<div class="tabs">${modes.map(m=>btn(m,'rank-mode',m,rankMode===m?'selected':'')).join('')}</div><section class="card"><h2>${rankMode}</h2>${a.length?`<div class="table-wrap"><table><thead><tr><th>Rank</th><th>Company</th><th>Metric</th><th>Price</th></tr></thead><tbody>${a.slice(0,25).map((x,i)=>`<tr><td>${i+1}</td><td>${btn(x.name,'detail',x.id)}</td><td>${rankMode.includes('risk')||rankMode.includes('stable')?riskLabel(x.risk)+' ('+x.risk.toFixed(2)+')':pct(metric(x))}</td><td>${money(x.price)}</td></tr>`).join('')}</tbody></table></div>`:empty('Buy assets to build your personal ranking.')}</section><section class="card"><h2>Investor records</h2>${row('Best yearly return',[...S.rivals].sort((a,b)=>b.best-a.best)[0].name+' · '+pct(Math.max(...S.rivals.map(r=>r.best))))}${row('Biggest yearly loss',[...S.rivals].sort((a,b)=>a.worst-b.worst)[0].name+' · '+pct(Math.min(...S.rivals.map(r=>r.worst))))}${row('Most stable investor','Emma Safehold')}${row('Most aggressive investor','Kenji Riskmax')}${leaderboard().map((r,i)=>row('#'+(i+1)+' '+r.name,money(r.worth))).join('')}</section>`}
function renderSettings(){return heading('Your game, your pace.','Everything runs locally in this single file.')+renderThemeSettings()+`<div class="grid two"><section class="card"><h2>Time controls</h2>${speeds()}<div class="note">At 1×, five real seconds equal one game month; one real minute equals one game year (525,600×). The simulation pauses while the tab is hidden, a dialog is open, or an amount is being entered. No offline progress is added.</div><h2>Save & continue</h2><p>Autosaves every three game months and after transactions. A manual load replaces the current run with the last saved state.</p><div class="flex">${btn('Save game','save','','primary')}${btn('Load game','load')}${btn('Reset game','reset','','danger')}</div><p class="subtext" style="margin-top:15px">Storage is specific to this browser and file location. Private browsing or blocked local storage may prevent saving. A visible message reports failures.</p></section><section class="card"><h2>Learn the mechanics</h2><p>This is a fictional learning game. It is not real financial advice.</p><p>All company data, forecasts and economic conditions are simulated. No real money is involved.</p>${btn('Replay tutorial','nav','Tutorial')}<h3 style="margin-top:24px">A billion is only the beginning</h3><p>Reach RU$1,000,000,000 net worth to win. Choose Continue to keep every asset, rival and obligation intact.</p></section></div>`}
function renderTutorial(){return heading('Your guide to the first million.','The objective is simple. The decisions are not.')+`<div class="grid two">${[['01 · Raise your first capital','Start with RU$0 and a credit score of 60. Visit Bank and borrow part of your RU$100,000 initial line at 8% annual interest. Borrowing adds equal cash and debt, so it does not create wealth.','Bank'],['02 · Own productive assets','Search 120 companies or six index funds. Open an asset to see five years of simulated prices, then enter shares to buy. Diversify rather than concentrating everything in a single name.','Market'],['03 · Keep debt under control','Monthly capitalized interest compounds to the quoted annual rate. A stable index may earn less than your loan costs. Repay debt using cash and keep reserves for fees.','Bank'],['04 · Follow a changing world','Major events arrive every two game years. Each severity star lasts six months. Multiple events combine. Rumors resolve later and can be false.','News / Events'],['05 · Expand your strategy','Brokers manage cash for a fee. Crypto adds volatility. Property pays monthly rent minus maintenance. Subscriptions offer imperfect advice and insurance covers only specific losses.','Brokers'],['06 · Win, then keep going','Net worth is all asset values minus debt. Reach RU$1 billion to win, then Continue or Play Again. Excessive debt can cause bankruptcy after the first-year grace period.','Rivals']].map(x=>`<section class="card"><span class="pill">${x[0]}</span><p style="margin-top:18px">${x[1]}</p>${btn('Explore →','nav',x[2])}</section>`).join('')}</div><div class="note">One real minute = one game year at 1×. Pause to plan. Your progress saves locally. This is a fictional learning game. It is not real financial advice.</div>`}
const renders={'Dashboard':renderDashboard,'Market':renderMarket,'Company Detail':renderCompanyDetail,'Portfolio':renderPortfolio,'Bank':renderBank,'Brokers':renderBrokers,'Subscriptions / Advice':renderSubscriptions,'Insurance':renderInsurance,'Crypto':renderCrypto,'Real Estate':renderRealEstate,'News / Events':renderNewsEvents,'Rivals':renderRivals,'Rankings':renderRankings,'Settings':renderSettings,'Tutorial':renderTutorial};
function renderSidebar(){const groups={Main:[['Dashboard','Dashboard'],['Market','Market'],['Portfolio','Portfolio'],['News / Events','News / Events']],Finance:[['Bank','Bank'],['Brokers','Brokers'],['Subscriptions','Subscriptions / Advice'],['Insurance','Insurance'],['Crypto','Crypto'],['Real Estate','Real Estate']],Competition:[['Rivals','Rivals'],['Rankings','Rankings']],System:[['Settings','Settings'],['Tutorial','Tutorial']]};$('#sidebar').innerHTML=`<div class="between"><strong style="font-size:20px">RU<span style="color:var(--accent)">$</span> Billionaire</strong><button class="sidebar-close" data-action="menu-close" aria-label="Close navigation">×</button></div><div class="sidebar-summary"><small>NET WORTH</small><div class="summary-worth mono">${money(calculateNetWorth(),true)}</div><small>${date(S.month)} · Credit ${Math.round(S.player.credit)} · Rank #${playerRank()}</small></div>${Object.entries(groups).map(([g,items])=>`<div class="eyebrow">${g}</div><div class="sidebar-grid">${items.map(([label,target])=>`<button class="nav ${page===target?'active':''}" data-action="nav" data-arg="${target}" ${page===target?'aria-current="page"':''}>${label}</button>`).join('')}${g==='System'?btn('Save','save','','nav')+btn('Load','load','','nav')+btn('Reset','reset','','nav danger'):''}</div>`).join('')}`}
function render(force=false){$('#topWorth').textContent=money(calculateNetWorth(),true);$('#topDate').textContent=date(S.month)+(S.speed===0?' · Paused':' · '+S.speed+'×');$('#pageTitle').textContent=page;$('#marketTicker').innerHTML=renderMarketTicker();renderSidebar();if(!force&&['INPUT','SELECT'].includes(document.activeElement?.tagName))return;const retained={};document.querySelectorAll('#main input').forEach(i=>{if(i.id)retained[i.id]=i.value});let openDetails=[...document.querySelectorAll('#main details')].map(d=>d.open);$('#main').innerHTML=(renders[page]||renderDashboard)()+`<footer class="footer"><span>RU$ BILLIONAIRE <span style="color:var(--accent)"> / </span> THE WEALTH EXPERIMENT</span><span>This is a fictional learning game. It is not real financial advice.</span></footer>`;if(!force){for(let[id,value]of Object.entries(retained)){let el=document.getElementById(id);if(el)el.value=value}document.querySelectorAll('#main details').forEach((d,i)=>d.open=!!openDetails[i])}$('#bottomNav').innerHTML=['Dashboard','Market','Portfolio','Bank','Settings'].map(p=>`<button data-action="nav" data-arg="${p}" ${page===p?'aria-current="page"':''}>${p}</button>`).join('')}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function modal(content){$('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true">${content}</div>`;$('#modal').hidden=false;$('#modal button')?.focus()}
function closeModal(){$('#modal').hidden=true;lastTime=performance.now()}
function showEnd(){if(S.bankrupt)modal(`<div class="symbol">↘</div><h1>Bankruptcy: You lost control of your debt.</h1><p>${esc(S.reason)}</p>${row('Final date',date(S.month))}${row('Final net worth',money(calculateNetWorth()))}${row('Total debt',money(S.player.debt))}<div style="margin-top:24px">${btn('Reset game','reset-now','','primary')}</div>`);else if(S.hasWon&&!S.victoryAcknowledged)modal(`<div class="symbol">✦</div><span class="pill">THE BILLIONAIRE CLUB</span><h1 style="margin-top:18px">You became a RU$ billionaire!</h1><p>You built ${money(calculateNetWorth())} in net worth. Your next chapter is yours to write.</p><div class="flex">${btn('Continue','continue','','primary')}${btn('Play Again','reset-now')}</div>`)}
function saveGame(notify=true){S.selectedTheme=selectedTheme;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));if(notify)toast('Game saved.')}catch(e){toast('Save unavailable: browser storage is blocked or full.')}}
function validSave(s){if(s?.activeMarketEffects!==undefined&&(!Array.isArray(s.activeMarketEffects)||!s.activeMarketEffects.every(e=>e&&Number.isInteger(e.startDate)&&Number.isInteger(e.endDate)&&Number.isInteger(e.durationMonths)&&e.durationMonths>0&&e.endDate===e.startDate+e.durationMonths&&Array.isArray(e.affectedAssets)&&Array.isArray(e.affectedIndustries)&&e.data&&['asset','industry','market','rival-plan'].includes(e.data.kind)&&Number.isFinite(e.impactStrength))))return false;if(!s||s.version!==1||!s.player||!Array.isArray(s.companies)||s.companies.length<100||!Array.isArray(s.indexFunds)||s.indexFunds.length!==6||!Array.isArray(s.cryptos)||s.cryptos.length!==5||!Array.isArray(s.properties)||s.properties.length!==8)return false;for(let key of ['brokers','subscriptions','insurances','rivals','activeEvents','eventLog','activeRumors','rumorLog','newsLog','annualReports','history','achievements'])if(!Array.isArray(s[key]))return false;if(!s.holdings||!s.yearStats||!s.rumorShocks||![0,.5,1,2,5].includes(s.speed)||!Number.isInteger(s.month)||s.month<0)return false;if(!['cash','debt','credit'].every(k=>Number.isFinite(s.player[k])&&s.player[k]>=0)||s.player.credit>100)return false;let assets=[...s.companies,...s.indexFunds,...s.cryptos,...s.properties];if(!assets.every(a=>Number.isFinite(a.price)&&a.price>0&&Array.isArray(a.history)&&a.history.every(Number.isFinite)))return false;return Object.entries(s.holdings).every(([id,h])=>assets.some(a=>a.id===id)&&Number.isFinite(h.units)&&h.units>0&&Number.isFinite(h.average)&&h.average>0)}
function loadGame(initial=false){try{let raw=localStorage.getItem(SAVE_KEY);if(!raw){if(!initial)toast('No saved game found.');return false}let data=JSON.parse(raw);if(!validSave(data))throw Error('Invalid save');S=data;migrateEffects();if(!initial){applyTheme(S.selectedTheme||DEFAULT_THEME);try{localStorage.setItem(THEME_KEY,selectedTheme)}catch(e){}}elapsed=0;lastTime=performance.now();if(!initial){closeModal();render(true);showEnd();toast('Saved game loaded.')}return true}catch(e){if(!initial)toast('Could not load this save. Your current game is unchanged.');return false}}
function transact(id,units,buy){let a=getAsset(id);if(!Number.isFinite(units)||units<=0)return toast('Enter a positive number of units.');if(id.startsWith('p')&&!Number.isInteger(units))return toast('Properties must be bought as whole units.');let h=S.holdings[id]||{units:0,average:0},cost=a.price*units;if(!Number.isFinite(cost))return toast('Amount is too large.');if(buy){if(cost>S.player.cash+1e-7)return toast('Not enough cash.');h.average=(h.average*h.units+cost)/(h.units+units);h.units+=units;S.player.cash=Math.max(0,S.player.cash-cost);S.holdings[id]=h}else{if(units>h.units+1e-9)return toast('You do not own enough shares.');units=Math.min(units,h.units);S.player.cash+=a.price*units;h.units-=units;if(h.units<1e-10)delete S.holdings[id];else S.holdings[id]=h}checkEnd();saveGame(false);render();toast((buy?'Bought ':'Sold ')+units.toLocaleString('en-US',{maximumFractionDigits:6})+' '+(a.ticker||a.name)+'.')}
function nav(p){page=p;closeMenu();render(true);window.scrollTo(0,0)}function closeMenu(){$('#sidebar').inert=true;$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}
function action(act,arg){if(act==='theme')return setTheme(arg);if(S.bankrupt&&!['reset','reset-now','load','load-now','menu','menu-close','nav','save','close-modal'].includes(act))return showEnd();if(act==='nav')return nav(arg);if(act==='menu'){$('#sidebar').inert=false;$('#sidebar').classList.add('open');$('#scrim').classList.add('open');$('#menuBtn').setAttribute('aria-expanded','true');return}if(act==='menu-close')return closeMenu();if(act==='speed'){S.speed=Number(arg);lastTime=performance.now();saveGame(false);render();return}if(act==='detail'||act==='detail-or-property'){if(arg.startsWith('p'))return nav('Real Estate');selected=arg;return nav('Company Detail')}if(act==='market-tab'){marketTab=arg;query='';sector='All industries';render(true);return}if(act==='rank-mode'){rankMode=arg;render(true);return}if(act==='save')return saveGame();if(act==='load')return modal(`<h2>Load saved game?</h2><p>This replaces your current progress with your last saved state.</p><div class="flex">${btn('Load save','load-now','','primary')}${btn('Cancel','close-modal')}</div>`);if(act==='load-now')return loadGame();if(act==='reset')return modal(`<h2>Start a new run?</h2><p>Your current save, investments and history will be replaced. This cannot be undone.</p><div class="flex">${btn('Reset game','reset-now','','danger')}${btn('Keep playing','close-modal')}</div>`);if(act==='close-modal')return closeModal();if(act==='reset-now'){newGame();closeModal();page='Dashboard';saveGame(false);render(true);return}if(act==='continue'){S.victoryAcknowledged=true;closeModal();saveGame(false);render(true);return}if(['buy','sell','sell-all','max-buy','property-buy','property-sell'].includes(act)){let units=act==='sell-all'?S.holdings[arg]?.units||0:act==='max-buy'?S.player.cash/getAsset(arg).price:act.startsWith('property')?1:Number($('#tradeUnits').value);return transact(arg,units,['buy','max-buy','property-buy'].includes(act))}if(act==='borrow'||act==='repay'){let n=Number($('#bankAmount').value);if(!Number.isFinite(n)||n<=0)return toast('Enter a positive amount.');if(act==='borrow'){if(n>loanLimit()+1e-8)return toast('This exceeds your available loan.');S.player.cash+=n;S.player.debt+=n;S.player.borrowed=true}else{if(n>S.player.cash)return toast('Not enough cash.');if(n>S.player.debt+1e-8)return toast('Repayment exceeds your debt.');let old=S.player.debt;S.player.cash-=n;S.player.debt=Math.max(0,old-n);S.player.credit=clamp(S.player.credit+n/Math.max(old,100000)*6,0,100);S.player.repaid+=n}toast(act==='borrow'?'Loan deposited. Interest starts accruing.':'Debt repaid. Credit improved.')}if(act==='broker-in'||act==='broker-out'){let b=S.brokers[Number(arg)],n=Number($('#broker'+arg).value);if(!Number.isFinite(n)||n<=0)return toast('Enter a positive amount.');if(act==='broker-in'){if(n>S.player.cash)return toast('Not enough cash.');if(b.value===0&&n<b.min)return toast('Minimum initial deposit is '+money(b.min)+'.');S.player.cash-=n;b.value+=n;b.contributed+=n}else{if(n>b.value)return toast('Not enough broker balance.');S.player.cash+=n;b.value-=n;b.contributed-=n}b.history.push(b.value);toast('Broker transfer completed.')}if(act==='subscription'||act==='insurance'){let x=(act==='subscription'?S.subscriptions:S.insurances)[Number(arg)];if(x.active){x.active=false;toast('Cancelled. No further renewals will be charged.')}else{let cost=act==='subscription'?x.cost:premium(x);if(S.player.cash<cost)return toast('Not enough cash.');S.player.cash-=cost;x.active=true;x.next=S.month+12;if(act==='subscription'){S.yearStats.subscriptions+=cost;advice(x)}else{S.yearStats.insurance+=cost;x.paid=cost}toast('Activated. Annual payment charged.')}}checkEnd();saveGame(false);render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.arg)});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render(true);$('#search').focus();$('#search').setSelectionRange(pos,pos)}if(e.target.id==='tradeUnits'){let n=Number(e.target.value);$('#tradeEstimate').textContent='Estimated value: '+money((Number.isFinite(n)?n:0)*getAsset(selected).price)}});document.addEventListener('change',e=>{if(e.target.id==='sector'){sector=e.target.value;render(true)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(!S.bankrupt&&(!S.hasWon||S.victoryAcknowledged))closeModal()}if(e.key==='Tab'&&!$('#modal').hidden){let buttons=[...$('#modal').querySelectorAll('button')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function gameLoop(){let now=performance.now(),delta=now-lastTime;lastTime=now;if(document.hidden||!$('#modal').hidden||S.bankrupt||S.speed===0||document.activeElement?.tagName==='INPUT')return;elapsed+=delta*S.speed;let advanced=false;while(elapsed>=5000){elapsed-=5000;updateTime();advanced=true;if(S.bankrupt||(S.hasWon&&!S.victoryAcknowledged))break}if(advanced)render()}
document.addEventListener('visibilitychange',()=>{lastTime=performance.now();if(document.hidden)saveGame(false)});window.addEventListener('beforeunload',()=>saveGame(false));newGame();let restored=loadGame(true);loadTheme();render(true);showEnd();if(!restored)toast('Welcome. Open the bank to begin your first investment.');setInterval(gameLoop,200);
</script>
</body>
</html>
